spring.application.name=user-management

server.port=8080
# server.servlet.context-path=/ums

spring.datasource.url=${UMS_DB_URL:jdbc:postgresql://localhost:5432/usm}
spring.datasource.username=${UMS_DB_USER:postgres}
spring.datasource.password=${UMS_DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true